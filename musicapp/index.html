<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Music Discovery App - Prototype</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2f36">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music Discovery">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app no-scrollbar">
    <img src="img/bg_splash.jpg" class="bg-fixed" alt="">
    <section class="splash" aria-hidden="true">
        <img src="img/01_ring_0_splash.png" class="ring ring-0" alt="">
        <img src="img/01_ring_1_splash.png" class="ring ring-1" alt="">
        <img src="img/01_ring_2_splash.png" class="ring ring-2" alt="">
        <img src="img/01_ring_3_splash.png" class="ring ring-3" alt="">
    </section>
    
    <section data-screen="home" class="view home intro" hidden>
      <img src="img/bg_default.jpg" class="bg-fixed" alt="">
      <div class="slice">
        <img src="img/section_discovery_rings.png" class="section-discovery-rings" alt="">
        <img src="img/section_home_top.png" alt="">
        <a class="hot" data-go="discovery" style="top: 88%;width: 40%;height: 12%;left: 30%;"></a>
      </div>
      <!-- CAROUSEL: data-carousel makes this slice swipe left/right. The image must be exported wider than the
           screen (extra cards off to the right). Optional: data-card="N" snaps to every N pt (card width + gap). -->
      <div class="slice section-header">
        <div class="section-title">        
          <h3>Connected</h3>
          <h1>Deep Cuts</h1>
        </div>
        <div class="section-actions">
          <div class="section-actions">
          <div class="pips">
            <i class="on"></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>
        </div>
      </div>
      <div class="slice scroll-stations" data-carousel>
        <img src="img/section_stations.png" alt="">
      </div>
      <div class="slice section-header">
        <div class="section-title">        
          <h3>Same Label</h3>
          <h1>Same Era</h1>
        </div>
        <div class="section-actions">
        </div>
      </div>        
      </div>      
      <div class="slice">
        <img src="img/section_samelabel.png" alt="">
      </div>
      <!-- <div class="slice" data-carousel>
        <img src="img/section_mixtapes.png" alt="">
      </div> -->
      <div class="slice section-header">
        <div class="section-title">        
          <h3>Pulling</h3>
          <h1>The Thread</h1>
        </div>
        <div class="section-actions">
          <div class="pips">
            <i class="on"></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>
      </div>        
      </div>
      <div class="slice" data-carousel>
        <img src="img/section_thread.png" alt="">
      </div>
      <div class="slice section-header">
          <div class="section-title">
            <h3>What You've</h3>
            <h1>Been Spinning</h1>
          </div>
          <div class="section-actions">
            <img src="icons/icon_play.png" class="icon" alt="">         
          </div>
      </div>   
      <div class="slice scroll-spinning" data-carousel>
        <img src="img/section_spinning.png" alt="">
      </div>
      </div>
    </section>

    <section data-screen="library" class="view library" hidden>
      <img src="img/bg_default.jpg" class="bg-fixed" alt="">
      <div class="slice">
        <img src="img/section_library_top.png" alt="">        
      </div>      
      <div class="slice section-header">
        <div class="section-title">
          <h3>What's On</h3>
          <h1>Heavy Rotation</h1>
        </div>
        <div class="section-actions">
          <div class="pips">
            <i class="on"></i>
            <i></i>
            <i></i>
            <i></i>
          </div>
        </div>        
      </div>      
      <div class="slice scroll-stations" data-carousel>
        <img src="img/section_stations.png" alt="">
      </div>      
      <div class="slice section-header">
        <div class="section-title">        
          <h3>What You've</h3>
          <h1>Been Spinning</h1>
        </div>
        <div class="section-actions">
          <img src="icons/icon_sort.png" class="icon" alt="">
          <img src="icons/icon_filter.png" class="icon" alt="">         
        </div>        
      </div>
      <div class="slice">
        <img src="img/section_library_spinning.png" alt="">
      </div>      
    </section>

    <section data-screen="discovery" class="view discovery" hidden>
      <img src="img/bg_discovery.jpg" class="bg-fixed" alt="">
      <div class="slice">
        <img src="img/section_discovery_top.png" alt="">        
      </div>
      <div class="slice">
        <img src="img/rings_discovery_empty.png" class="rings-all" alt="">        
      </div>
    </section>

  </main>
  <nav class="nav">
    <div class="nav-pill">
      <a data-tab="home">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5 12 3l9 8.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Home</span>
      </a>
      <a data-tab="library">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.2 5.6l3.9.9-3.3 13.9-3.9-.9z"/></svg>
        <span>Library</span>
      </a>
      <a data-tab="discovery">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2.5" fill="currentColor"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="10"/></svg>
        <span>Discovery</span>
      </a>
    </div>
    <a class="nav-search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
    </a>
  </nav>
<!--   <nav class="nav">
    <div class="slice">
      <img src="img/nav_mobile.png" class="nav-mobile" alt="">
      <a class="hot" data-tab="home" style="left: 1%;bottom: 11%;width: 26%;height: 80%;"></a>
      <a class="hot" data-tab="library" style="left: 27%;bottom: 11%;width: 26%;height: 80%;"></a>
      <a class="hot" data-tab="discovery" style="left: 54%;bottom: 11%;width: 26%;height: 80%;"></a>      
    </div>
  </nav> -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/nw-utils.js"></script>
  <script src="js/hot-measure.js"></script>
</body>
</html>
