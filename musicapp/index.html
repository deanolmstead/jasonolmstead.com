<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Music Discovery App Prototype</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2f36">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="New Worlds">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #2b2f36;
    --card: #23262c;
    --text: #fff;
    --muted: #9a9da3;
    --pill: #454950;
    --pad: 20px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Outfit', system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none;
  }
  .app {
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(env(safe-area-inset-top) + 24px)
      var(--pad)
      calc(env(safe-area-inset-bottom) + 160px);
  }
  .eyebrow { font-size: 14px; letter-spacing: .02em; text-transform: uppercase; color: var(--muted); margin: 32px 0 0; }
  h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.04em; margin: 0 0 14px; }
  .greeting { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; }
  .card {
    background: var(--card); border-radius: 22px; padding: 22px;
    min-height: 190px; display: flex; flex-direction: column; justify-content: flex-end;
  }
  .card b { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
  .card span { color: var(--muted); font-size: 16px; margin-top: 6px; }
  .pill { display: inline-block; background: var(--pill); border-radius: 999px; padding: 12px 22px; margin-top: 14px; font-weight: 500; }

  .nav {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(env(safe-area-inset-bottom) + 10px);
    display: flex; gap: 10px;
  }
  .nav .bar { flex: 1; display: flex; justify-content: space-around; align-items: center;
    background: rgba(35,38,44,.92); border-radius: 999px; padding: 14px 8px; font-weight: 500; }
  .nav .on { background: var(--pill); border-radius: 999px; padding: 8px 16px; }
  .nav .search { width: 56px; height: 56px; border-radius: 50%; background: rgba(35,38,44,.92); }
  .app { max-width: 480px; margin: 0 auto; }
  .nav { max-width: 456px; margin: 0 auto; }  
</style>
</head>
<body>
  <main class="app">
    <section data-screen="splash" hidden></section>
    
    <section data-screen="home">
      <div class="greeting" data-reset>Good to have you back, J</div>

      <p class="eyebrow">Discover artists</p>
      <h2>explore deeper</h2>
      <div class="card"><b>Dive deeper and discover new artist connections.</b><div><span class="pill">Choose an Artist</span></div></div>

      <p class="eyebrow">Connected</p>
      <h2>deep cuts</h2>
      <div class="card"><b>Best of 90’s Thrill Jockey</b><span>Tortoise, Sea and Cake, Trans Am, Eleventh Dream Day…</span></div>
    </section>
  </main>

  <nav class="nav">
    <div class="bar"><span class="on">Home</span><span>Library</span><span>Discovery</span></div>
    <div class="search"></div>
  </nav>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/nw-utils.js"></script> 
</body>
</html>
