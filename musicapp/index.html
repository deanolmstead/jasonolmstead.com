<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Music Discovery App - Prototype</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2f36">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Music Discovery">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <main class="app no-scrollbar">
    <section class="splash" aria-hidden="true">
      
        <img src="img/01_ring_0_splash.png" class="ring ring-0" alt="">
        <img src="img/01_ring_1_splash.png" class="ring ring-1" alt="">
        <img src="img/01_ring_2_splash.png" class="ring ring-2" alt="">
        <img src="img/01_ring_3_splash.png" class="ring ring-3" alt="">
      
    </section>
    
    <section data-screen="home" class="home intro" hidden>

      <div class="greeting" data-reset>Good to have you back, J</div>
      <div class="slice">
        <img src="img/section_discover.png" alt="">
        <a class="hot" data-go="discover-artists" style="right: -20px; top: 152px; width: 220px; height: 50px; border: solid 1px;"></a>
      </div>
      <div class="slice">
        <img src="img/section_stations.png" alt="">
      </div>
      <div class="slice">
        <img src="img/section_samelabel.png" alt="">
      </div>
      <div class="slice">
        <img src="img/section_mixtapes.png" alt="">
      </div>      
      <div class="slice">
        <img src="img/section_thread.png" alt="">
      </div>
      <div class="slice">
        <img src="img/section_spinning.png" alt="">
      </div>

    </section>

    <section data-screen="discover-artists" class="discover-artists" hidden>
      <div class="slice">
        <img src="img/screen_artists.jpg" alt="">
        <a class="hot" data-back="home" style="left: 10px;top: 50px;width: 55px;height: 55px;border: solid 1px;"></a>
      </div>
    </section>

  </main>

  <nav class="nav">
     <div class="slice"><img src="img/nav_mobile.png" class="nav-mobile" alt=""></div>
   </nav>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/nw-utils.js"></script>
  <script src="js/hot-measure.js"></script>
</body>
</html>
