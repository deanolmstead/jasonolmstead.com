<!-- ── Player Bar ─────────────────────────────────────────────────────────── -->
<section class="track-listening">

    <!-- Row 1: Song title -->
    <div class="player-title">
        <h2 data-amplitude-song-info="name" class="song-name"></h2>
        <p>SLW/SGNL</p>
    </div>

    <!-- Row 2: Controls + volume -->
    <div class="player-middle">
        <ul class="player-controls">
            <li class="btn-shuffle amplitude-shuffle" title="Shuffle">
                <svg class="icon icon-shuffle"><use href="#icon-shuffle"/></svg>
            </li>
            <li class="btn-prev amplitude-prev">
                <svg class="icon icon-prev"><use href="#icon-prev"/></svg>
            </li>
            <li class="btn-play amplitude-play-pause">
                <svg class="icon icon-play"><use href="#icon-play"/></svg>
                <svg class="icon icon-pause"><use href="#icon-pause"/></svg>
            </li>
            <li class="btn-next amplitude-next">
                <svg class="icon icon-next"><use href="#icon-next"/></svg>
            </li>
            <li class="btn-repeat amplitude-repeat-song" title="Repeat">
                <svg class="icon icon-repeat"><use href="#icon-repeat"/></svg>
            </li>
        </ul>

        </div>
    </div>

    <!-- Row 3: Progress bar -->
    <div class="player-progress">
        <span class="current-time amplitude-current-time">0:00</span>
        <div id="progress-container">
            <input type="range" class="amplitude-song-slider" step=".1">
            <progress id="song-played-progress" class="amplitude-song-played-progress"></progress>
            <progress id="song-buffered-progress" class="amplitude-buffered-progress" value="0"></progress>
        </div>
        <span class="duration-time amplitude-duration-time">0:00</span>
        <div class="player-volume">
            <div class="amplitude-mute btn-mute">
                <svg class="icon icon-volume"><use href="#icon-volume"/></svg>
                <svg class="icon icon-mute"><use href="#icon-mute"/></svg>
            </div>
            <div class="volume-container">
                <input type="range" class="amplitude-volume-slider" step=".1">
        </div>        
    </div>

</section>

<div class="bg-noise"></div>
